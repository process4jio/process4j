name: mvn pages

on:
  push:
    branches: ["master"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: mvn process-resources -B
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/classes/META-INF/resources/
      - id: deployment
        uses: actions/deploy-pages@v4